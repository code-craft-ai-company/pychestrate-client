name: Question
description: Ask how something behaves or how to use it.
title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: |
        Check the README and the documentation first. **Do not post passwords, tokens or keys.**
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
