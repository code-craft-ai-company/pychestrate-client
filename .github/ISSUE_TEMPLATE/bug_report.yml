name: Bug report
description: Something does not work as it is described or documented.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. This project is source-available and takes issues only, not pull requests.
        **Do not report a security problem here.** Use the Security tab, then "Report a vulnerability".
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The package version, release, or commit you are using.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and how you installed or ran it.
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste anything that helps. Remove passwords, tokens and keys first.
      render: text
