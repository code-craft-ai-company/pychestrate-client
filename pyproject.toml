[tool.poetry]
name = "pychestrate-client"
description = "Pychestrate - pod-side runtime client (enroll, dispatch, testbase, results)"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Source-Available"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX",
    "Private :: Do Not Upload"
]
keywords = [
    "python",
    "pychestrate",
    "client",
    "automation"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
codecraftai-foundations = ">=1.0.0,<2.0.0"
codecraftai-credentials = ">=1.0.0,<2.0.0"
codecraftai-restclient-base = ">=1.0.0,<2.0.0"
codecraftai-testbase = ">=1.0.0,<2.0.0"
codecraftai-restclient-pychestrate = ">=1.0.0,<2.0.0"
cryptography = ">=42.0.0"

[tool.poetry.group.dev.dependencies]

[tool.poetry.scripts]
pychestrate-client = "ccai.pychestrate.client.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
